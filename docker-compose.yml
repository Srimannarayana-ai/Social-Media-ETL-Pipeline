version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: social_media_db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=social_media_db
      - POSTGRES_USER=postgres
    ports:
      - "5432:5432"
    volumes:
      - social_media_db_data:/var/lib/postgresql/data
      # Automatically initialize tables on start
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_media_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl_pipeline:
    build: .
    container_name: social_media_etl
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  social_media_db_data:
